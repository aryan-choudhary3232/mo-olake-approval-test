name: 2PC Integration Tests

on:
  push:
    branches:
      - "master"
    paths:
      - '**/*.go'
      - '**/*.java'
      - '.github/workflows/2pc-integration-tests.yml'
      - '.github/workflows/integration-tests-runner.yml'
  pull_request:
    branches:
      - "*"
    paths:
      - '**/*.go'
      - '**/*.java'
      - '.github/workflows/2pc-integration-tests.yml'
      - '.github/workflows/integration-tests-runner.yml'

permissions:
  contents: read

# A new push to a pull request cancels its older run, including one still waiting for approval.
# Pushes to master each get their own group (by sha), so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  twopc-integration-tests:
    uses: ./.github/workflows/integration-tests-runner.yml
    with:
      test_type: 2pc
